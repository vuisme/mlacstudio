<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to MLAC Studio</title><link rel="stylesheet" href="/static/auth.css"></head>
<body><main class="card">
  <p class="eyebrow">Local studio</p>
  <h1>Welcome back</h1>
  <p class="intro">Log in to use the generation queue and local gallery.</p>
  <form data-mode="login">
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p class="error" id="error" hidden></p>
  <p class="foot">The server listens only on 127.0.0.1.</p>
</main><script src="/static/auth.js"></script></body>
</html>
