name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install test and build dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt
      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q web packaging tests
      - name: Reset generated test fixtures
        shell: pwsh
        run: Remove-Item tests/runtime, tests/packaging_fixtures -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Compile lightweight bootstrapper
        shell: pwsh
        run: ./packaging/build-bootstrap.ps1 -Version 0.0.0-ci -OutputDirectory dist/ci
      - name: Verify bootstrap size and payload exclusions
        shell: pwsh
        run: |
          $file = Get-Item dist/ci/MLAC-Studio-Setup-0.0.0-ci.exe
          if ($file.Length -gt 10MB) { throw "Bootstrapper is too large: $($file.Length)" }
          $forbidden = Get-ChildItem dist/ci -Recurse -File | Where-Object { $_.Extension -in '.gguf','.safetensors' -or $_.Name -match 'sd-(server|cli)\.exe' }
          if ($forbidden) { throw "Bootstrap contains forbidden payloads: $($forbidden.FullName -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: mlac-bootstrap-ci
          path: dist/ci/MLAC-Studio-Setup-0.0.0-ci.exe
          if-no-files-found: error
